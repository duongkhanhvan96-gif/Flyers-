<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyers Practice</title>
<meta name="description" content="A2 Flyers vocabulary and grammar practice with instant scoring.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f8fc; --card:#ffffff; --ink:#1d2b3a; --muted:#5d6b7a; --line:#dde6ef;
  --brand:#2f6fde; --brand-ink:#ffffff; --brand-soft:#e6efff;
  --sun:#ffc83d; --sun-soft:#fff4d6;
  --ok:#1f9d55; --ok-soft:#e3f6ea; --bad:#d64545; --bad-soft:#fde8e8;
  --shadow:0 2px 0 rgba(29,43,58,.06), 0 8px 24px rgba(29,43,58,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
a{color:var(--brand)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.hd{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding:8px 0}
.logo{font-weight:900;font-size:22px;letter-spacing:.2px;color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px;margin-right:auto}
.logo .kite{width:32px;height:32px;background:var(--sun);border-radius:8px;display:grid;place-items:center;font-size:18px;transform:rotate(-8deg)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;font-weight:800;padding:8px 14px;border-radius:999px;font-size:15px;background:rgba(255,255,255,.12)}
nav a.on{background:#fff;color:var(--brand)}
main{padding:20px 0 48px}
h1{font-size:28px;line-height:1.2;margin:4px 0 6px;font-weight:900}
h2{font-size:21px;margin:0 0 4px;font-weight:900}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tcard{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tcard:hover,.tcard:focus-visible{transform:translateY(-2px);border-color:var(--brand)}
.tnum{flex:none;width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-weight:900;display:grid;place-items:center}
.tnum svg{width:36px;height:36px}
.tname{font-weight:800;line-height:1.25}
.hero{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:22px;display:grid;gap:14px}
.hero p{margin:0}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bigcard{display:block;text-decoration:none;color:var(--ink);background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);border:2px solid transparent}
.bigcard:hover{border-color:var(--brand)}
.bigcard .em{font-size:34px}
.bigcard b{display:block;font-size:20px;font-weight:900;margin-top:6px}
.bigcard span{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;text-decoration:none;margin-bottom:8px}
.panel{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:16px 0}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.word{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff}
.word .pic{width:64px;height:64px;display:grid;place-items:center}
.word .pic svg{width:64px;height:64px}
.word .ph{width:56px;height:56px;border-radius:14px;background:var(--sun-soft);color:#9a6b00;font-weight:900;font-size:24px;display:grid;place-items:center}
.word .w{font-weight:800;line-height:1.2;word-break:break-word}
.say{border:0;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:4px 10px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.say:hover{background:var(--brand);color:#fff}
.theory h4{margin:14px 0 4px;font-size:18px;color:var(--brand)}
.theory p,.theory ul{margin:6px 0}
.theory li{margin:4px 0}
.theory .sig{background:var(--sun-soft);border-radius:10px;padding:6px 10px;font-size:15px}
.theory .note{background:var(--brand-soft);border-radius:10px;padding:8px 10px;font-size:15px}
.tblwrap{overflow-x:auto}
table.gt{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0;min-width:420px}
table.gt th,table.gt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.gt th{background:var(--brand-soft)}
.exh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.exh .tag{background:var(--sun);color:#4a3500;font-weight:900;border-radius:999px;padding:2px 12px;font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px;padding:10px;border:2px dashed var(--line);border-radius:12px}
.bank span{background:var(--sun-soft);border-radius:8px;padding:2px 10px;font-weight:800}
ol.items{padding-left:0;list-style:none;margin:10px 0 0;counter-reset:q}
ol.items>li{counter-increment:q;padding:12px 12px 12px 44px;position:relative;border-radius:12px;margin-bottom:8px;border:2px solid transparent}
ol.items>li::before{content:counter(q);position:absolute;left:10px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:900;font-size:13px;display:grid;place-items:center}
ol.items>li.ok{background:var(--ok-soft);border-color:#b6e3c6}
ol.items>li.bad{background:var(--bad-soft);border-color:#f2bcbc}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.opt .l{font-weight:900;color:var(--brand);margin-right:6px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:#fff;box-shadow:inset 0 0 0 1px var(--ok)}
input.blank{font:inherit;font-weight:800;color:var(--brand);border:0;border-bottom:2px solid var(--brand);background:transparent;padding:0 4px;width:9em;max-width:100%;border-radius:0}
input.blank:focus{outline:none;background:var(--brand-soft)}
input.blank.ok{color:var(--ok);border-color:var(--ok)}
input.blank.bad{color:var(--bad);border-color:var(--bad)}
.fix{display:block;font-size:14px;color:var(--ok);font-weight:800;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:900;cursor:pointer}
.btn.p{background:var(--brand);color:#fff}
.btn.s{background:var(--brand-soft);color:var(--brand)}
.score{font-weight:900;font-size:18px;margin-left:auto}
.score.good{color:var(--ok)}
.notice{background:var(--sun-soft);border-radius:14px;padding:12px 14px;margin:12px 0}
.muted{color:var(--muted);font-size:15px}
ol.sheet{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
ol.sheet>li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:12px;border:2px solid var(--line)}
ol.sheet>li.ok{background:var(--ok-soft);border-color:#b6e3c6}
ol.sheet>li.bad{background:var(--bad-soft);border-color:#f2bcbc}
ol.sheet>li.wr{display:block;border:0;padding:0}
.qn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:900;font-size:14px;display:grid;place-items:center}
.lab{min-width:6.5em}
input.blank.wide{width:auto;flex:1 1 10em;min-width:8em}
select.sel{font:inherit;font-weight:800;color:var(--brand);border:2px solid var(--line);border-radius:10px;padding:4px 10px;background:#fff}
.opts.col{flex-direction:column;align-items:stretch;flex:1 1 100%}
.opts.col .opt{border-radius:12px;text-align:left}
ol.sheet .opts{margin-top:0}
ol.sheet .fix{flex:1 1 100%;margin-top:0}
.selfk{display:flex!important;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--ink)!important;font-weight:700!important}
.selfk .tick{display:inline-flex;gap:6px;align-items:center;color:var(--brand);font-weight:800}
.selfk input,.checklist input{width:20px;height:20px;accent-color:var(--brand)}
textarea.story{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
textarea.story:focus{outline:none;border-color:var(--brand)}
.wc{color:var(--muted);font-weight:800;font-size:14px;margin-top:4px}
.checklist label{display:flex;gap:8px;align-items:center;margin:4px 0}
.rub{font-weight:800;line-height:1.35}
.wbank{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;margin:10px 0;padding:10px;border:2px dashed var(--line);border-radius:14px}
.wbank.small{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.wb{display:flex;align-items:center;gap:8px;font-weight:800;background:var(--sun-soft);border-radius:10px;padding:4px 8px}
.wi{width:34px;height:34px;flex:none;display:grid;place-items:center}
.wi svg{width:34px;height:34px}
.emo{font-size:28px;line-height:1}
ol.qs li.ex{background:var(--bg);border-color:var(--line)}
ol.qs li.ex{counter-increment:none}
ol.qs li.ex::before{content:"Ex"}
.exa,.exw{font-family:"Comic Sans MS","Segoe Print","Chalkboard SE",cursive;color:#0b6b8a;font-weight:700}
.exa{margin-top:4px}
.exw{text-decoration-color:#0b6b8a}
input.blank.line{display:block;width:100%;margin-top:6px}
input.blank.wide4{width:12em}
.gn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:900;margin:0 4px 0 2px;vertical-align:middle}
.story{background:#fffdf6;border:2px solid #f3e6c2;border-radius:14px;padding:4px 14px;line-height:1.9}
.story p{margin:10px 0}
.story input.blank{width:7.5em}
.story.letter{font-style:normal}
h3.th{margin:12px 0 6px;font-size:19px;text-align:center}
.opts-box{display:grid;gap:4px;background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin:8px 0}
select.sel.inl{padding:2px 6px;margin:2px 0}
select.sel.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
select.sel.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.opts.ok .opt.sel{border-color:var(--ok);background:var(--ok-soft)}
.opts.bad .opt.sel{border-color:var(--bad);background:var(--bad-soft)}
.ans{display:inline-block;margin:0 6px;font-size:14px;font-weight:900;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:0 6px}
.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pnl{position:relative;border:3px solid var(--ink);border-radius:12px;background:#fff;min-height:110px;display:grid;place-items:center;padding:18px 6px 8px}
.pn{position:absolute;top:4px;left:6px;font-weight:900;font-size:14px;color:var(--muted)}
.pics{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.pics svg{width:48px;height:48px}
textarea.story-in{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
textarea.story-in:focus{outline:none;border-color:var(--brand)}
@media (max-width:520px){.pics svg{width:34px;height:34px}.pnl{min-height:90px}}
.total{font-weight:900;font-size:18px;color:var(--brand);text-align:right;margin:0 4px 8px}
footer{color:var(--muted);font-size:14px;padding:20px 0 40px;border-top:1px solid var(--line)}
@media (max-width:520px){
  h1{font-size:24px}
  .logo{font-size:19px}
  nav a{padding:7px 11px;font-size:14px}
  ol.items>li{padding-left:40px}
}
</style>
</head>
<body>
<header><div class="wrap hd">
  <a class="logo" href="#home"><span class="kite">🪁</span>Flyers Practice</a>
  <nav>
    <a href="#vocab" data-nav="vocab">Vocabulary</a>
    <a href="#grammar" data-nav="grammar">Grammar</a>
    <a href="#tests" data-nav="tests">Practice tests</a>
  </nav>
</div></header>
<main class="wrap" id="app" tabindex="-1"></main>

{ id:"g1", title:"Present simple • Present continuous",

{ id:"g3", title:"Present perfect",

{ id:"g5", title:"Can / Could • May / Might • Shall",
  theory:`<p><b>Modal verbs</b> are always followed by the base verb (no -s, no -ing, no <i>to</i>). We don't use do/does with them: <i>Can you swim? She can't swim.</i></p>
  <ul>
  <li><b>can</b> — ability now, informal permission, informal requests: <i>I can swim. Can I go out?</i></li>
  <li><b>could</b> — past ability, polite requests, possibility: <i>When I was 5, I could count to 100. Could you open the window, please?</i></li>
  <li><b>may</b> — polite permission, possibility: <i>May I come in? It may rain later.</i></li>
  <li><b>might</b> — possibility (= maybe): <i>I might go to the park later.</i></li>
  <li><b>shall</b> — offers and suggestions with I / we: <i>Shall I open the window? Shall we go to the park?</i></li>

{ id:"g6", title:"Should • Must • Have to",
  theory:`<ul>
  <li><b>should / shouldn't</b> — advice (a good or bad idea): <i>You should drink more water. You shouldn't eat so many sweets.</i></li>
  <li><b>must</b> — very important or necessary: <i>You must wear a helmet.</i></li>
  <li><b>mustn't</b> — not allowed: <i>You mustn't run in the corridor.</i></li>
  <li><b>have to / has to</b> — a rule or another person says so: <i>I have to wear a uniform.</i></li>
  <li><b>don't / doesn't have to</b> — not necessary: <i>It's Sunday. I don't have to go to school.</i></li>
  <li><b>had to</b> — obligation in the past (there is no past form of must): <i>I had to walk home yesterday.</i></li>
  </ul>
  <p class="note">⚠️ <b>Have to</b> is not a modal verb: <i>he <b>has</b> to</i>, <i><b>Do</b> I have to…?</i>, <i>She <b>doesn't</b> have to…</i></p>`,

{ id:"g7", title:"Tag questions",
  theory:`<p>A <b>tag question</b> is a short question at the end of a sentence. We use it to check information or to sound friendly.</p>
  <p><b>Positive sentence → negative tag. Negative sentence → positive tag.</b></p>
  <ul>
  <li><b>be</b>: <i>She is tired, <b>isn't she</b>? They weren't hungry, <b>were they</b>?</i></li>
  <li><b>present simple</b> (do/does): <i>You like pizza, <b>don't you</b>? She doesn't drink coffee, <b>does she</b>?</i></li>
  <li><b>past simple</b> (did): <i>She went home, <b>didn't she</b>? He didn't call, <b>did he</b>?</i></li>
  <li><b>modals</b> (can, will, should): <i>You can swim, <b>can't you</b>? She will come, <b>won't she</b>?</i></li>
  </ul>
  <p class="note">💡 The pronoun matches the subject: <i>Ben is late, isn't <b>he</b>? This is your book, isn't <b>it</b>?</i></p>`,

{ id:"g8", title:"Adverbs",
  theory:`<h4>Adverbs of manner (how?)</h4>
  <p>Usually adjective + <b>-ly</b>: slow → slowly, careful → carefully, quiet → quietly. Irregular: good → <b>well</b>, fast → fast, hard → hard. They go <b>after the verb</b> or <b>after the object</b>: <i>She sings beautifully. He reads the book carefully.</i></p>
  <h4>Adverbs of frequency (how often?)</h4>
  <p>always, usually, often, sometimes, never — <b>before the main verb</b> but <b>after be</b>: <i>She always walks to school. He is usually late.</i></p>
  <h4>Adverbs with the present perfect</h4>
  <ul>
  <li><b>yet</b> — negatives and questions, at the end: <i>I haven't finished yet.</i></li>
  <li><b>already</b> — sooner than expected: <i>She has already eaten.</i></li>
  <li><b>just</b> — a short time ago: <i>He has just arrived.</i></li>
  <li><b>ever</b> — in questions: <i>Have you ever been to London?</i></li>
  <li><b>never</b> — not at any time: <i>I have never seen snow.</i></li>

{ id:"g9", title:"Conjunctions",
  theory:`<p><b>Conjunctions</b> join two parts of a sentence.</p>

  <li><b>but</b> — shows a difference: <i>I wanted to play outside, <b>but</b> it was raining.</i></li>
  <li><b>or</b> — shows a choice: <i>Do you want tea <b>or</b> coffee?</i></li>
  <li><b>because</b> — gives a reason (Why?): <i>I stayed home <b>because</b> I was sick.</i></li>
  <li><b>so</b> — shows a result: <i>I was tired, <b>so</b> I went to bed.</i></li>
  </ul>`,

    {q:"We can watch a movie {} play a game.", a:[["or"]]},
    {q:"He wanted to go swimming, {} the pool was closed.", a:[["but"]]},
    {q:"She bought apples {} bananas at the market.", a:[["and"]]},
    {q:"Tom likes football, {} his brother prefers basketball.", a:[["but"]]},
    {q:"Lucy finished her homework {} went to bed.", a:[["and"]]}]}]},

{ id:"g10", title:"Zero conditional",
  theory:`<p>Use the <b>zero conditional</b> for things that are <b>always true</b>: facts, rules, routines and habits. When one thing happens, another thing always happens.</p>
  <table class="gt"><tr><th>Structure</th><th>Example</th></tr>
  <tr><td>If + present simple, present simple</td><td><i>If it rains, we stay inside.</i></td></tr>
  <tr><td>Present simple + if + present simple</td><td><i>We stay inside if it rains.</i></td></tr></table>
  <p class="note">💡 Use the <b>present simple in both parts</b>. Use a comma when the if-clause comes first.</p>`,
  ex:[
  {type:"mcq", title:"Choose the correct answer.", items:[
    {q:"If you heat ice, it ___.", o:["melts","melted","will melting"], a:0, new:true},
    {q:"If it ___, we stay inside.", o:["rains","rained","raining"], a:0, new:true},
    {q:"Plants die if they ___ get water.", o:["doesn't","don't","didn't"], a:1, new:true},
    {q:"If I'm tired, I ___ to bed early.", o:["go","goes","went"], a:0, new:true},
    {q:"If you mix red and white, you ___ pink.", o:["gets","got","get"], a:2, new:true},
    {q:"My dog barks if someone ___ at the door.", o:["knock","knocks","knocking"], a:1, new:true}]},
  {type:"fill", title:"Write the correct form of the verb in brackets.", items:[
    {q:"If I {} (feel) tired, I go to bed early.", a:[["feel"]]},
    {q:"My brother makes a sandwich if he {} (be) hungry.", a:[["is"]]},
    {q:"If we {} (not study) for the test, we get poor marks.", a:[["do not study"]]},
    {q:"My dad {} (drink) a lot of water if the weather is hot.", a:[["drinks"]]},
    {q:"If you {} (mix) blue and yellow, you get green.", a:[["mix"]]},
    {q:"Tom's teacher gets angry if he {} (not do) his homework.", a:[["does not do"]]},
    {q:"If the baby {} (cry), her mum picks her up.", a:[["cries"]]}]}]},

{ id:"g11", title:"Where • Before • After • While",
  theory:`<h4>Where</h4>
  <p>A <b>where</b> clause tells us about a place. It often comes after <i>know, remember, forget, ask, show, tell</i>: <i>I know <b>where</b> he lives. He forgot <b>where</b> he put his keys.</i></p>
  <h4>Before / After</h4>
  <p>Show which action happens first: <i>I brush my teeth <b>before</b> I go to bed. She called her mum <b>after</b> she arrived home.</i></p>
  <p class="note">⚠️ No future after before / after / while: <i>I will call you after I <b>finish</b> dinner</i>, not <s>after I will finish</s>.</p>
  <h4>While</h4>
  <p>Two actions at the same time: <i><b>While</b> I was cooking dinner, my phone rang. <b>While</b> Mum was cooking, Dad was cleaning the kitchen. <b>While</b> I cook dinner, the kids do their homework.</i></p>`,
  ex:[
  {type:"mcq", title:"Choose the correct answer.", items:[
    {q:"I brush my teeth ___ I go to bed.", o:["after","before","where"], a:1, new:true},
    {q:"Do you know ___ the bus stop is?", o:["where","while","before"], a:0, new:true},
    {q:"___ I was cooking dinner, my phone rang.", o:["Where","After","While"], a:2, new:true},
    {q:"She called her mum ___ she arrived home, to say she was safe.", o:["before","after","where"], a:1, new:true},
    {q:"I will call you after I ___ dinner.", o:["will finish","finish","finishing"], a:1, new:true},
    {q:"He forgot where he ___ his keys yesterday.", o:["put","puts","will put"], a:0, new:true},
    {q:"While Mum ___, Dad was cleaning the kitchen.", o:["cooks","was cooking","cooked"], a:1, new:true}]},
  {type:"fill", title:"Emma's day at the zoo. Write WHERE, BEFORE, AFTER or WHILE, and the correct form of the verb.", items:[
    {q:"{} they {} (leave) home, her dad checked the map.", a:[["before"],["left"]]},
    {q:"Her dad didn't know {} the zoo {} (be).", a:[["where"],["was"]]},
    {q:"{} they {} (arrive) at the zoo, Emma ran to see the monkeys.", a:[["after"],["arrived"]]},
    {q:"Her little brother couldn't remember {} he {} (put) his hat.", a:[["where"],["put"]]},
    {q:"Emma always eats a snack {} she {} (watch) the animal show.", a:[["while"],["watches"]]},
    {q:"{} the show {} (finish), the family had lunch near the lake.", a:[["after"],["finished"]]},
    {q:"{} they {} (eat), Emma took a photo of the lake.", a:[["while"],["were eating"]]}]}]},

{ id:"g12", title:"Be • Look • Sound • Feel • Taste • Smell + like",
  theory:`<p><b>Like</b> here means <b>similar to</b>. We use it to compare two things.</p>
  <ul>
  <li><b>What + be + … + like?</b> — asks for a description: <i>What is your teacher like?</i></li>
  <li><b>look like</b> — what we see: <i>She looks like her sister.</i></li>
  <li><b>sound like</b> — what we hear (and ideas): <i>That sounds like a baby. That sounds like fun!</i></li>
  <li><b>feel like</b> — what we touch: <i>This pillow feels like cotton wool.</i></li>
  <li><b>taste like</b> — food and drink: <i>This juice tastes like orange.</i></li>
  <li><b>smell like</b> — smells: <i>It smells like pizza.</i></li>
  </ul>
  <p class="note">💡 Use the present simple with -s for he / she / it: <i>It smell<b>s</b> like…</i></p>`,
  ex:[
  {type:"mcq", title:"Choose the correct word.", items:[
    {q:"Lucy walks into the kitchen. \"Wow! It ___ like a bakery in here!\"", o:["smells","tastes","sounds"], a:0},
    {q:"Her grandmother gives her a piece. \"It ___ like apple pie.\"", o:["feels","tastes","looks"], a:1},
    {q:"Lucy touches the table. \"This table ___ like real wood.\"", o:["feels","tastes","sounds"], a:0},
    {q:"\"That's me when I was young. Don't I ___ like your mum?\"", o:["taste","sound","look"], a:2},
    {q:"There is a noise upstairs. \"That ___ like someone walking.\"", o:["tastes","smells","sounds"], a:2},
    {q:"Lucy lies on the sofa. \"This sofa ___ like a cloud!\"", o:["sounds","feels","tastes"], a:1},
    {q:"\"What ___ your new teacher ___?\" — \"She is very kind.\"", o:["is / like","does / like","does / likes"], a:0}]},
  {type:"fill", title:"Write LOOK, SOUND, FEEL, TASTE, SMELL or BE in the present simple.", items:[
    {q:"This cake {} like chocolate.", a:[["tastes"]]},
    {q:"That noise {} like a dog barking.", a:[["sounds"]]},
    {q:"She {} like her older sister.", a:[["looks"]]},
    {q:"This soap {} like lemons.", a:[["smells"]]},
    {q:"What {} the weather like in winter?", a:[["is"]]},
    {q:"He {} like a famous actor.", a:[["looks"]]},
    {q:"These flowers {} like roses.", a:[["smell"]]}]}]},

{ id:"g13", title:"Make + somebody / something + adjective",
  theory:`<p>Use <b>make + somebody/something + adjective</b> to say how something affects a person or thing.</p>
  <table class="gt"><tr><th>Structure</th><th>Example</th></tr>
  <tr><td>S + make / makes / made + O + adjective</td><td><i>The weather makes <b>me</b> happy.<br>This noise makes the dog <b>nervous</b>.</i></td></tr></table>
  <p class="note">💡 After <b>make</b>, use an <b>object pronoun</b> (me, you, him, her, us, them) and an <b>adjective</b> (happy, not happily).</p>`,
  ex:[
  {type:"mcq", title:"Choose the correct answer.", items:[
    {q:"That loud noise always makes ___ nervous.", o:["I","me","my"], a:1},
    {q:"Loud music makes ___ afraid.", o:["hers","she","her"], a:2},
    {q:"The scary film made ___ sad.", o:["we","us","our"], a:1},
    {q:"Sunny weather makes me ___.", o:["happy","happily","happiness"], a:0},
    {q:"The long bus ride made the children ___.", o:["sleepily","sleep","sleepy"], a:2},
    {q:"Sam smells fresh cookies from the kitchen. The cookies make Sam ___.", o:["sleepy","hungry","tired"], a:1},
    {q:"Ben ran for a long time. Now he can't run anymore. Running makes Ben ___.", o:["happy","hungry","tired"], a:2}]},
  {type:"fill", title:"Use an adjective from the box.", bank:["tired","nervous","hungry","happy","sleepy","cold"], items:[
    {q:"The long walk made us very {}.", a:[["tired"]], new:true},

    {q:"Warm milk at night makes the baby {}.", a:[["sleepy"]], new:true},
    {q:"The ice in my drink made my hands {}.", a:[["cold"]], new:true}]}]},

{ id:"g14", title:"What time…? • What else…? • What … next?",
  theory:`<ul>
  <li><b>What time…?</b> — asks for the exact time: <i>What time does the film start?</i></li>
  <li><b>What else…?</b> — asks about another thing: <i>What else do we need?</i></li>
  <li><b>What … next?</b> — asks about the next step: <i>What shall we do next?</i></li>
  </ul>
  <p>Structure: <b>What time / What else + auxiliary or modal + S + V?</b> &nbsp; <b>What + auxiliary or modal + S + V + next?</b></p>`,
  ex:[
  {type:"mcq", title:"Choose the correct answer.", items:[
    {q:"Ji: ___ does the train arrive? Joe: It arrives at 6 p.m.", o:["What time","What else","What"], a:0},

{ id:"g15", title:"Be made of…",
  theory:`<p>Use <b>be made of</b> to talk about the material something is made from.</p>

  <tr><td>Present</td><td>am / is / are + made of</td><td><i>The toys <b>are made of</b> plastic.</i></td></tr>
  <tr><td>Past</td><td>was / were + made of</td><td><i>That old house <b>was made of</b> wood.</i></td></tr></table>
  <p class="note">💡 After <b>made of</b>, use a noun: <i>made of <b>wood</b></i>, not <s>made of wooden</s>.</p>`,

{ id:"g16", title:"Greetings • Goodbyes • Thanks • Sorry",
  theory:`<ul>
  <li><b>Greetings:</b> Hello. / Hi. / Good morning. / Good afternoon. / Good evening. — How are you? → I'm fine, thanks.</li>
  <li><b>Meeting someone new:</b> Nice to meet you. → Nice to meet you too.</li>
  <li><b>Introducing:</b> I'm Anna. / This is my friend, Ben.</li>
  <li><b>Goodbyes:</b> Goodbye. / See you later. / Good night. / Take care. / Have a nice weekend!</li>
  <li><b>Thanks:</b> Thank you. / Thanks a lot. → You're welcome. / My pleasure. / No problem.</li>
  <li><b>Sorry:</b> I'm sorry. → That's OK. / Never mind. — <b>Excuse me</b> (to get attention). — <b>Pardon?</b> (please say it again)</li>
  <li><b>Requests & offers:</b> Could you open the door, please? / Would you like some tea? → Yes, please. / No, thank you.</li>
  <li><b>Suggestions:</b> Let's… / How about…? / Shall we…? → Great idea! / Sorry, I can't. Maybe next time.</li>
  </ul>`,
  ex:[
  {type:"mcq", title:"Choose the best answer.", items:[

    {q:"You are cold and you want your father to close the window. You say:", o:["Would you like to close the window?","Do you want me to close it?","Could you close the window, please?"], a:2},
    {q:"You meet your new classmate for the first time. You say:", o:["Nice to meet you.","See you later.","Never mind."], a:0, new:true},
    {q:"Your friend says, \"Thank you for helping me!\" You reply:", o:["Excuse me.","You're welcome.","Pardon?"], a:1, new:true}]},
  {type:"fill", title:"Complete the dialogues with a phrase from the box.", bank:["Pardon?","My pleasure","Never mind","Would you like","Take care","Nice to meet you","Have a nice weekend"], items:[
    {q:"A: You look tired. {} a glass of water? B: Yes, please.", a:[["would you like"]]},
    {q:"A: I forgot your notebook. I'm really sorry! B: {}. You can bring it tomorrow.", a:[["never mind"]]},

<script>
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS = ['A','B','C','D'];

// ---------- answer normalization ----------
function norm(s){
  s = String(s).toLowerCase().replace(/[‘’ʼ`´]/g,"'").replace(/[“”]/g,'"');
  s = s.replace(/\bcan't\b/g,'cannot').replace(/\bwon't\b/g,'will not').replace(/\bshan't\b/g,'shall not');
  s = s.replace(/n't\b/g,' not').replace(/'ll\b/g,' will').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/\bi'm\b/g,'i am');
  s = s.replace(/\bcan not\b/g,'cannot');
  s = s.replace(/[.?!,;:"]/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim();
  return s;
}
const isRight = (val, alts) => alts.some(a => norm(a) === norm(val));

// ---------- speech ----------
const canSpeak = 'speechSynthesis' in window;
let voice = null;
function pickVoice(){
  if(!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,'').replace(/–/g,' to '));
  u.lang = voice ? voice.lang : 'en-GB'; if(voice) u.voice = voice; u.rate = .85;
  speechSynthesis.speak(u);
}

// ---------- views ----------
function setNav(key){ document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on', a.dataset.nav===key)); }
function icon(e){ return e && ICONS[e] ? ICONS[e] : ''; }
function topicIcon(t){ const w = t.words && t.words.find(w=>w[1] && ICONS[w[1]]); return w ? ICONS[w[1]] : ''; }

function home(){
  setNav('');
  app.innerHTML = `
  <h1>A2 Flyers Practice</h1>
  <p class="sub">Luyện từ vựng, ngữ pháp và đề mẫu Flyers — làm bài và chấm điểm ngay.</p>
  <div class="big">
    <a class="bigcard" href="#vocab"><div class="em">📚</div><b>Vocabulary</b><span>${VOCAB.length} topics · words with pictures</span></a>
    <a class="bigcard" href="#grammar"><div class="em">✏️</div><b>Grammar</b><span>${GRAMMAR.length} units · short lessons</span></a>
    <a class="bigcard" href="#tests"><div class="em">📝</div><b>Practice tests</b><span>4 Reading &amp; Writing tests · instant scores</span></a>
  </div>`;
}

function list(kind){
  const data = kind==='vocab' ? VOCAB : GRAMMAR;
  setNav(kind);
  app.innerHTML = `
  <h1>${kind==='vocab' ? 'Vocabulary' : 'Grammar'}</h1>
  <p class="sub">${kind==='vocab' ? 'Pick a topic. Learn the words, then do 2 exercises.' : 'Pick a unit. Read the lesson, then do 2 exercises.'}</p>
  <div class="grid">${data.map((t,i)=>{
    const ic = kind==='vocab' ? topicIcon(t) : '';
    return `<a class="tcard" href="#${t.id}"><span class="tnum">${ic || (i+1)}</span><span class="tname">${kind==='vocab'?'':'<small style="color:var(--muted)">Unit '+(i+1)+'</small><br>'}${esc(t.title)}</span></a>`;
  }).join('')}</div>`;
}

function topic(t, kind){
  const data = kind==='vocab' ? VOCAB : GRAMMAR;
  const idx = data.indexOf(t);
  setNav(kind);
  let html = `<a class="back" href="#${kind}">← All ${kind==='vocab'?'topics':'units'}</a>
  <h1>${kind==='vocab'?'Topic':'Unit'} ${idx+1}: ${esc(t.title)}</h1>`;
  if(kind==='vocab'){
    html += `<section class="panel"><h2>Word list</h2><p class="sub" style="margin:0 0 10px">${canSpeak?'Tap 🔊 to hear each word.':''}</p><div class="words">${
      t.words.map(([w,e])=>{
        const ic = icon(e);
        return `<div class="word"><div class="pic">${ic || `<div class="ph">${esc(w[0].toUpperCase())}</div>`}</div><div class="w">${esc(w)}</div>${canSpeak?`<button class="say" data-say="${esc(w)}" aria-label="Listen: ${esc(w)}">🔊 Listen</button>`:''}</div>`;
      }).join('')}</div></section>`;
  } else {
    html += `<section class="panel theory"><h2>Lesson</h2>${t.theory.replace(/<table/g,'<div class="tblwrap"><table').replace(/<\/table>/g,'</table></div>')}</section>`;
  }
  t.ex.forEach((ex,ei)=>{ html += exercise(ex, `${t.id}-${ei}`, ei); });
  const nxt = data[idx+1];
  html += `<div class="bar">${nxt?`<a class="btn s" href="#${nxt.id}" style="text-decoration:none">Next: ${esc(nxt.title)} →</a>`:''}</div>`;
  app.innerHTML = html;
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
  t.ex.forEach((ex,ei)=>wire(ex, `${t.id}-${ei}`));
}

function exercise(ex, id, n){
  let body = '';
  if(ex.bank) body += `<div class="bank">${ex.bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`;
  body += `<ol class="items">`;
  ex.items.forEach((it,qi)=>{
    if(ex.type==='mcq'){
      body += `<li data-q="${qi}"><div>${esc(it.q).replace(/___/g,'<b>______</b>')}</div><div class="opts" role="radiogroup">${
        it.o.map((o,oi)=>`<button type="button" class="opt" role="radio" aria-checked="false" data-o="${oi}"><span class="l">${LETTERS[oi]}</span>${esc(o)}</button>`).join('')}</div></li>`;
    } else {
      let k = 0;
      const line = esc(it.q).replace(/\{\}/g, ()=>`<input class="blank" data-b="${k++}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer">`);
      body += `<li data-q="${qi}"><div>${line}</div></li>`;
    }
  });
  body += `</ol>`;
  return `<section class="panel" id="${id}"><div class="exh"><span class="tag">Exercise ${n+1}</span><h2>${esc(ex.title)}</h2></div>${body}
  <div class="bar"><button class="btn p" data-act="check">Check answers</button><button class="btn s" data-act="show">Show answers</button><button class="btn s" data-act="reset">Try again</button><span class="score" aria-live="polite"></span></div></section>`;
}

function wire(ex, id){
  const sec = document.getElementById(id);
  const lis = [...sec.querySelectorAll('ol.items>li')];
  const score = sec.querySelector('.score');
  if(ex.type==='mcq'){
    lis.forEach(li=>li.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      li.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel');x.setAttribute('aria-checked','false')});
      b.classList.add('sel'); b.setAttribute('aria-checked','true');
      li.classList.remove('ok','bad');
    }));
  } else {
    sec.querySelectorAll('input.blank').forEach(inp=>{
      const fit = ()=>{ inp.style.width = Math.max(7, inp.value.length + 2) + 'ch'; };
      inp.addEventListener('input', ()=>{ fit(); inp.classList.remove('ok','bad'); inp.closest('li').classList.remove('ok','bad'); });
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const all=[...sec.querySelectorAll('input.blank')]; const nx=all[all.indexOf(inp)+1]; if(nx) nx.focus(); else sec.querySelector('[data-act=check]').click(); }});
    });
  }
  const clearFix = ()=>sec.querySelectorAll('.fix').forEach(f=>f.remove());
  sec.querySelector('[data-act=check]').onclick = ()=>{
    clearFix(); let got = 0;
    ex.items.forEach((it,qi)=>{
      const li = lis[qi]; let ok;
      if(ex.type==='mcq'){
        const sel = li.querySelector('.opt.sel');
        ok = sel && +sel.dataset.o === it.a;
      } else {
        const ins = [...li.querySelectorAll('input.blank')];
        ok = ins.every((inp,bi)=>{ const r = inp.value.trim() && isRight(inp.value, it.a[bi]); inp.classList.toggle('ok',!!r); inp.classList.toggle('bad',!r); return r; });
      }
      li.classList.toggle('ok', !!ok); li.classList.toggle('bad', !ok);
      if(ok) got++;
    });
    const tot = ex.items.length;
    score.textContent = `${got}/${tot} ${got===tot?'🌟 Excellent!':got>=Math.ceil(tot*.7)?'👍 Good job!':'💪 Keep trying!'}`;
    score.classList.toggle('good', got===tot);
  };
  sec.querySelector('[data-act=show]').onclick = ()=>{
    clearFix();
    ex.items.forEach((it,qi)=>{
      const li = lis[qi];
      if(ex.type==='mcq'){
        li.querySelectorAll('.opt').forEach(b=>b.classList.toggle('right', +b.dataset.o===it.a));
      } else {
        const ans = it.a.map(a=>a[0]);
        if(!li.classList.contains('ok')){
          const span = document.createElement('span'); span.className='fix';
          span.textContent = '✔ ' + ans.join(' / ');
          li.appendChild(span);
        }
      }
    });
  };
  sec.querySelector('[data-act=reset]').onclick = ()=>{
    clearFix(); score.textContent='';
    lis.forEach(li=>li.classList.remove('ok','bad'));
    sec.querySelectorAll('.opt').forEach(b=>{b.classList.remove('sel','right');b.setAttribute('aria-checked','false')});
    sec.querySelectorAll('input.blank').forEach(i=>{i.value='';i.classList.remove('ok','bad');i.style.width=''});
  };
}

// ---------- practice tests: 4 original Reading & Writing tests ----------
const RWTESTS = (()=>{
  const salt = new TextEncoder().encode('flyers-practice');
  const bin = atob(SAMPLE_BLOB); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i) ^ salt[i % salt.length];
  return JSON.parse(new TextDecoder().decode(bytes));
})();
// expand "(optional)" and "[a|b]" patterns into every accepted answer
function expand(p){
  let i = 0;
  const seq = stops => {
    let res = [''];
    while(i < p.length && !stops.includes(p[i])){
      const c = p[i];
      if(c==='('){ i++; const inner = seq(')'); i++; const opts = inner.concat(['']); res = res.flatMap(r=>opts.map(o=>r+o)); }
      else if(c==='['){ const alts=[]; do{ i++; alts.push(...seq('|]')); } while(p[i]==='|'); i++; res = res.flatMap(r=>alts.map(a=>r+a)); }
      else { res = res.map(r=>r+c); i++; }
    }
    return res;
  };
  return seq('').map(s=>s.replace(/\s+/g,' ').trim());
}
const textOk = (val, pats) => { const v = norm(val); return !!v && pats.flatMap(expand).map(norm).includes(v); };
const showPat = pats => expand(pats[0])[0];
const paras = s => s.split(/\n\n/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
const RUBRIC = {
  p1: 'Look and read. Choose the correct words and write them on the lines. There is one example.',
  p2: 'Read the conversation and choose the best answer. Write a letter (A–H) for each answer. There is one example.',
  p3: 'Read the story. Choose a word from the box. Write the correct word next to numbers 1–5. There is one example.',
  p4: 'Read the text. Choose the right words and write them on the lines.',
  p5: 'Read the story. Then complete the sentences about the story. You can use 1, 2, 3 or 4 words.',
  p6: 'Read the text. Write one word on each line.',
  p7: 'Look at the three pictures. Write about this story. Write 20 or more words.'
};
const ic = e => ICONS[e] || `<span class="emo">${e}</span>`;

function tests(){
  setNav('tests');
  app.innerHTML = `
  <h1>Practice tests</h1>
  <p class="sub">4 Reading &amp; Writing tests in the A2 Flyers format (7 parts). Your answers are scored on this page.</p>
  <div class="big">${RWTESTS.map(t=>`
    <a class="bigcard" href="#${t.id}"><div class="em">📝</div><b>${esc(t.title)}</b><span>${esc(t.theme)} · 7 parts</span></a>`).join('')}
  </div>
  <div class="notice"><b>How it works</b>
    <ol style="margin:6px 0 0;padding-left:22px">
      <li>Do each part, then tap <b>Check</b> to see your score.</li>
      <li>Tap <b>Show answers</b> to see the right answers.</li>
      <li>Part 7 is a story. Count your words, then show it to your teacher.</li>
    </ol></div>
  <p class="muted">These are practice tests written for this site, not official Cambridge papers. Official free sample tests: <a href="${PREP_URL}" target="_blank" rel="noopener">Preparing for A2 Flyers</a>.</p>`;
}

function rwTest(t){
  setNav('tests');
  const G = []; // graders per part
  const inp = (pi,k,cls='') => `<input class="blank ${cls}" id="${t.id}-${pi}-${k}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer ${k+1}">`;
  const num = n => `<span class="gn">${n}</span>`;
  const body = (p,pi) => {
    const g = G[pi] = [];
    let h = '';
    if(p.type==='p1'){
      h += `<div class="wbank">${p.words.map(([w,e])=>`<div class="wb"><span class="wi">${ic(e)}</span><span>${esc(w)}</span></div>`).join('')}</div>`;
      h += `<ol class="items qs"><li class="ex"><div>${esc(p.example.q)}</div><div class="exa">${esc(p.example.a)}</div></li>`;
      p.items.forEach((it,k)=>{ g.push({kind:'text',key:it.a}); h += `<li><div>${esc(it.q)}</div>${inp(pi,k,'line')}</li>`; });
      h += `</ol>`;
    } else if(p.type==='p2'){
      h += `<p><i>${esc(p.intro)}</i></p><div class="opts-box">${Object.entries(p.options).map(([l,o])=>`<div><b>${l}</b> ${esc(o)}</div>`).join('')}</div>`;
      h += `<ol class="items qs"><li class="ex"><div>${esc(p.example.q)}</div><div class="exa">${esc(p.example.a)}</div></li>`;
      p.items.forEach((it,k)=>{ g.push({kind:'select',key:it.a}); h += `<li><div>${esc(it.q)}</div><select class="sel" id="${t.id}-${pi}-${k}" aria-label="Answer ${k+1}"><option value="">–</option>${Object.keys(p.options).map(l=>`<option>${l}</option>`).join('')}</select></li>`; });
      h += `</ol>`;
    } else if(p.type==='p3'){
      h += `<div class="wbank small">${p.box.map(([w,e])=>`<div class="wb"><span class="wi">${ic(e)}</span><span>${esc(w)}</span></div>`).join('')}</div>`;
      let txt = esc(p.text).replace('{0}', `<u class="exw">${esc(p.example)}</u>`);
      p.keys.forEach((k,i)=>{ g.push({kind:'text',key:k}); txt = txt.replace(`{${i+1}}`, num(i+1)+inp(pi,i)); });
      h += `<div class="story">${paras(txt)}</div>`;
      const k = p.keys.length; g.push({kind:'choice',key:p.title.a,disp:p.title.opts[p.title.a]});
      h += `<p><b>${num(6)} Now choose the best name for the story.</b></p><div class="opts col" id="${t.id}-${pi}-${k}">${p.title.opts.map((o,oi)=>`<button type="button" class="opt" data-v="${oi}">${esc(o)}</button>`).join('')}</div>`;
    } else if(p.type==='p4'){
      let txt = esc(p.text).replace('{0}', `<u class="exw">${esc(p.example.o[p.example.a])}</u>`);
      p.gaps.forEach((gp,i)=>{ g.push({kind:'select',key:gp.o[gp.a]});
        txt = txt.replace(`{${i+1}}`, `${num(i+1)}<select class="sel inl" id="${t.id}-${pi}-${i}" aria-label="Gap ${i+1}"><option value="">…</option>${gp.o.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`); });
      h += `<p class="muted">Example: ${p.example.o.map((o,oi)=>oi===p.example.a?`<b><u>${esc(o)}</u></b>`:esc(o)).join(' / ')}</p><h3 class="th">${esc(p.heading)}</h3><div class="story">${paras(txt)}</div>`;
    } else if(p.type==='p5'){
      h += `<h3 class="th">${esc(p.heading)}</h3><div class="story">${paras(esc(p.story))}</div>`;
      h += `<ol class="items qs"><li class="ex"><div>${esc(p.example.q).replace('{}', `<u class="exw">${esc(p.example.a)}</u>`)}</div></li>`;
      p.items.forEach((it,k)=>{ g.push({kind:'text',key:it.a}); h += `<li><div>${esc(it.q).replace('{}', inp(pi,k,'wide4'))}</div></li>`; });
      h += `</ol>`;
    } else if(p.type==='p6'){
      let txt = esc(p.text).replace('{0}', `<u class="exw">${esc(p.example)}</u>`);
      p.keys.forEach((k,i)=>{ g.push({kind:'text',key:k}); txt = txt.replace(`{${i+1}}`, num(i+1)+inp(pi,i)); });
      h += `<h3 class="th">${esc(p.heading)}</h3><div class="story letter">${paras(txt)}</div>`;
    } else if(p.type==='p7'){
      h += `<div class="panels">${p.panels.map((pn,i)=>`<div class="pnl"><span class="pn">${i+1}</span><div class="pics">${pn.map(ic).join('')}</div></div>`).join('')}</div>
        <textarea class="story-in" rows="6" placeholder="Write your story here…" aria-label="Your story"></textarea><div class="wc">0 words</div>`;
    }
    return h;
  };
  let html = `<a class="back" href="#tests">← Practice tests</a><h1>${esc(t.title)}: Reading &amp; Writing</h1><p class="sub">${esc(t.theme)}</p>`;
  t.parts.forEach((p,pi)=>{
    const b = body(p,pi);
    const btns = p.type==='p7'
      ? `<button class="btn p" data-act="wcheck">Check my writing</button><button class="btn s" data-act="sample">See a sample answer</button>`
      : `<button class="btn p" data-act="check">Check</button><button class="btn s" data-act="show">Show answers</button><button class="btn s" data-act="reset">Clear</button>`;
    html += `<section class="panel part" id="${t.id}-p${pi}" data-pi="${pi}"><div class="exh"><span class="tag">Part ${pi+1}</span><span class="rub">${RUBRIC[p.type]}</span></div>${b}<div class="bar">${btns}<span class="score" aria-live="polite"></span></div></section>`;
  });
  html += `<div class="total" id="${t.id}-total"></div>`;
  const i = RWTESTS.indexOf(t), nx = RWTESTS[i+1];
  if(nx) html += `<div class="bar"><a class="btn s" style="text-decoration:none" href="#${nx.id}">Next: ${esc(nx.title)} →</a></div>`;
  app.innerHTML = html;
  wireRw(t, G);
}

function wireRw(t, G){
  const results = {};
  const max = G.reduce((a,g)=>a+g.length,0);
  const total = ()=>{
    const got = Object.values(results).reduce((a,b)=>a+b,0);
    document.getElementById(`${t.id}-total`).textContent = Object.keys(results).length ? `Your score so far: ${got}/${max} (Part 7 is marked by your teacher)` : '';
  };
  app.querySelectorAll('section.part').forEach(sec=>{
    const pi = +sec.dataset.pi, p = t.parts[pi], g = G[pi], score = sec.querySelector('.score');
    sec.querySelectorAll('.opts').forEach(grp=>grp.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      grp.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel','right')); b.classList.add('sel'); grp.classList.remove('ok','bad');
    }));
    sec.querySelectorAll('input.blank, select').forEach(el=>{
      const clear = ()=>{ el.classList.remove('ok','bad'); el.closest('li')?.classList.remove('ok','bad'); };
      el.addEventListener('input', clear); el.addEventListener('change', clear);
      if(el.tagName==='INPUT') el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const all=[...sec.querySelectorAll('input.blank')]; const n=all[all.indexOf(el)+1]; if(n) n.focus(); else sec.querySelector('[data-act=check]').click(); }});
    });
    if(p.type==='p7'){
      const ta = sec.querySelector('textarea'), wc = sec.querySelector('.wc');
      const count = ()=> (ta.value.trim().match(/[A-Za-z0-9'’-]+/g)||[]).length;
      ta.addEventListener('input',()=>{ const c=count(); wc.textContent = `${c} word${c===1?'':'s'}${c>=20?' ✔':''}`; });
      const box = (cls)=>{ let b = sec.querySelector('.'+cls); if(!b){ b=document.createElement('div'); b.className=cls+' notice'; sec.appendChild(b);} return b; };
      sec.querySelector('[data-act=wcheck]').onclick = ()=>{
        const c = count();
        box('checklist').innerHTML = `<b>${c>=20?'🌟 Good — you wrote '+c+' words.':'✏️ You wrote '+c+' words. Try to write 20 or more.'}</b>
          <div style="margin-top:6px">Check your story:</div>
          <label><input type="checkbox"><span>I wrote about all three pictures.</span></label>
          <label><input type="checkbox"><span>I used the past tense (went, saw, was…).</span></label>
          <label><input type="checkbox"><span>I used words like <i>then, suddenly, in the end</i>.</span></label>
          <label><input type="checkbox"><span>I checked my spelling, capital letters and periods.</span></label>
          <div class="muted" style="margin-top:6px">Show your story to your teacher for a score.</div>`;
      };
      sec.querySelector('[data-act=sample]').onclick = ()=>{ box('sample').innerHTML = `<b>Sample answer</b><p style="margin:6px 0 0">${esc(p.sample)}</p><div class="muted">Your story can be different. That's OK!</div>`; };
      return;
    }
    const ctl = k => document.getElementById(`${t.id}-${pi}-${k}`);
    const isOk = (gr,k) => {
      const el = ctl(k);
      if(gr.kind==='text') return textOk(el.value, gr.key);
      if(gr.kind==='select') return el.value === gr.key;
      const s = el.querySelector('.opt.sel'); return !!s && +s.dataset.v === gr.key;
    };
    const clearAns = ()=> sec.querySelectorAll('.ans').forEach(a=>a.remove());
    sec.querySelector('[data-act=check]').onclick = ()=>{
      clearAns(); let got = 0;
      g.forEach((gr,k)=>{
        const ok = isOk(gr,k), el = ctl(k);
        el.classList.toggle('ok',ok); el.classList.toggle('bad',!ok);
        const li = el.closest('ol.items li'); if(li){ li.classList.toggle('ok',ok); li.classList.toggle('bad',!ok); }
        if(ok) got++;
      });
      score.textContent = `${got}/${g.length} ${got===g.length?'🌟':got>=Math.ceil(g.length*.7)?'👍':'💪'}`;
      score.classList.toggle('good', got===g.length);
      results[pi] = got; total();
    };
    sec.querySelector('[data-act=show]').onclick = ()=>{
      clearAns();
      g.forEach((gr,k)=>{
        if(isOk(gr,k)) return;
        const el = ctl(k);
        if(gr.kind==='choice'){ el.querySelectorAll('.opt').forEach(b=>b.classList.toggle('right', +b.dataset.v===gr.key)); return; }
        const a = document.createElement('span'); a.className='ans';
        a.textContent = '✔ ' + (gr.kind==='text' ? showPat(gr.key) : gr.key);
        el.insertAdjacentElement('afterend', a);
      });
    };
    sec.querySelector('[data-act=reset]').onclick = ()=>{
      clearAns(); score.textContent='';
      sec.querySelectorAll('.ok,.bad').forEach(e=>e.classList.remove('ok','bad'));
      sec.querySelectorAll('input.blank').forEach(i=>i.value='');
      sec.querySelectorAll('select').forEach(s=>s.value='');
      sec.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel','right'));
      delete results[pi]; total();
    };
  });
}


function route(){
  const h = (location.hash||'#home').slice(1);
  if(canSpeak) speechSynthesis.cancel();
  const v = VOCAB.find(t=>t.id===h), g = GRAMMAR.find(t=>t.id===h);
  if(v) topic(v,'vocab');
  else if(g) topic(g,'grammar');
  else if(h==='vocab'||h==='grammar') list(h);
  else if(h==='tests') tests();
  else if(RWTESTS.find(t=>t.id===h)) rwTest(RWTESTS.find(t=>t.id===h));
  else home();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>
